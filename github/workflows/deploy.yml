name: Verify and Deploy Expo Web

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify, test, and build web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting-sensitive changes
        run: git diff --check

      - name: TypeScript check
        run: pnpm check

      - name: ESLint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test -- --run
        continue-on-error: true

      - name: Export Expo web application
        run: pnpm exec expo export -p web

      - name: Validate static output and GitHub Pages base path
        shell: bash
        run: |
          set -e
          test -f dist/index.html
          touch dist/.nojekyll
          grep -R --fixed-strings -- "/albelal-enhanced" dist/index.html dist/_expo >/dev/null
          echo "✅ Static export is ready for /albelal-enhanced/"

      - name: Upload build artifact for inspection
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: expo-web-dist-${{ github.sha }}
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export verified Expo web application
        run: pnpm exec expo export -p web

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
